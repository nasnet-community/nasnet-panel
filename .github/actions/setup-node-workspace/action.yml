name: Setup Node Workspace
description: Set up Node.js and restore workspace dependencies.

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: '20'
  install-command:
    description: Command used to install dependencies on cache miss
    required: false
    default: npm ci --no-audit --no-fund
  save-cache:
    description: >-
      Save node_modules to the cache on a miss. Only trusted runs (pushes to
      dev) may save, because Depot Cache is shared across branches and PRs.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - uses: actions/cache/restore@v5
      id: npm-cache
      with:
        path: node_modules
        key: node-modules-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      if: steps.npm-cache.outputs.cache-hit != 'true'
      shell: bash
      run: ${{ inputs.install-command }}

    - name: Save node_modules cache
      if: inputs.save-cache == 'true' && steps.npm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: node_modules
        key: ${{ steps.npm-cache.outputs.cache-primary-key }}
