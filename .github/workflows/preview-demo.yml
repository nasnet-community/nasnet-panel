# Redeploys the demo when a push to dev changes the frontend, by starting the
# Deploy workflow in nasnet-panel-preview. The demo runs only the frontend
# against mocks, so backend-only changes do not redeploy it. Needs the
# PREVIEW_DISPATCH_TOKEN secret: a fine-grained token with Contents: read and
# write on nasnet-panel-preview.
name: Rebuild demo

on:
  push:
    branches: [dev]
    paths:
      - 'frontend/**'
      - '!frontend/tests/**'
  workflow_dispatch:

permissions: {}

jobs:
  trigger:
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Trigger the preview deploy
        env:
          TOKEN: ${{ secrets.PREVIEW_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::PREVIEW_DISPATCH_TOKEN is not set"
            exit 0
          fi
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nasnet-community/nasnet-panel-preview/dispatches \
            -d '{"event_type":"nasnet-panel-updated"}'
