name: Snapshot Docker image

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write

concurrency:
  group: snapshot-dev
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/nasnet-community/nasnet-panel

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
          - platform: linux/arm/v7
            suffix: armv7
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:dev-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      - name: Enforce 15MB image size
        run: |
          set -euo pipefail
          FIRST_TAG="${{ env.IMAGE }}:dev-${{ matrix.suffix }}"
          SIZE_BYTES=$(docker buildx imagetools inspect "$FIRST_TAG" --raw \
            | jq '[.layers[].size] | add')
          SIZE_MB=$(awk "BEGIN { printf \"%.2f\", $SIZE_BYTES / 1048576 }")
          echo "Image $FIRST_TAG compressed size: ${SIZE_MB} MB"
          echo "- ${{ matrix.suffix }}: **${SIZE_MB} MB**" >> "$GITHUB_STEP_SUMMARY"
          if awk -v s="$SIZE_MB" 'BEGIN { exit !(s+0 > 15) }'; then
            echo "::error::Image exceeds 15MB budget (${SIZE_MB} MB)"
            exit 1
          fi
          if awk -v s="$SIZE_MB" 'BEGIN { exit !(s+0 > 12) }'; then
            echo "::warning::Image over 12MB soft warning (${SIZE_MB} MB)"
          fi

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          set -euo pipefail
          SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          for TAG in dev "dev-${SHA}" latest; do
            echo "-> ${IMAGE}:${TAG}"
            docker buildx imagetools create --tag "${IMAGE}:${TAG}" \
              "${IMAGE}:dev-amd64" \
              "${IMAGE}:dev-arm64" \
              "${IMAGE}:dev-armv7"
          done

  package:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Log in to ${{ env.REGISTRY }}
        run: skopeo login "${{ env.REGISTRY }}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Package per-arch RouterOS container tars
        run: |
          set -euo pipefail
          mkdir -p dist
          for SUFFIX in amd64 arm64 armv7; do
            REF="${IMAGE}:dev-${SUFFIX}"
            OUT="nasnet-panel-dev-${SUFFIX}.tar"
            echo "-> ${REF} => dist/${OUT}"
            skopeo copy "docker://${REF}" "docker-archive:dist/${OUT}:nasnet-panel:dev-${SUFFIX}"
            ( cd dist && sha256sum "${OUT}" > "${OUT}.sha256" )
          done

      - name: Publish to rolling snapshot release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot
          name: Dev snapshot
          prerelease: true
          body: |
            Rolling development snapshot, rebuilt on every push to `dev`.
            Commit ${{ github.sha }}.

            RouterOS container image tars consumed by `scripts/install.sh`:
            - `nasnet-panel-dev-amd64.tar` (RouterOS x86_64)
            - `nasnet-panel-dev-arm64.tar` (RouterOS arm64)
            - `nasnet-panel-dev-armv7.tar` (RouterOS arm)

            Windows GUI installer:
            - `nasnet-panel-installer-windows-amd64.exe`
          files: |
            dist/*.tar
            dist/*.tar.sha256

  installer:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-go-backend
        with:
          go-version-file: installer/windows/go.mod
          cache-dependency-path: installer/windows/go.sum

      - name: Build Windows installer
        working-directory: installer/windows
        run: |
          set -euo pipefail
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -tags desktop,production \
            -ldflags "-s -w -H windowsgui" \
            -o dist/nasnet-panel-installer-windows-amd64.exe .
          ( cd dist && sha256sum nasnet-panel-installer-windows-amd64.exe > nasnet-panel-installer-windows-amd64.exe.sha256 )

      - name: Publish installer to snapshot release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot
          prerelease: true
          files: |
            installer/windows/dist/*.exe
            installer/windows/dist/*.exe.sha256
