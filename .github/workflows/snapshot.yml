name: Snapshot Docker image

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write

concurrency:
  group: snapshot-dev
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/nasnet-community/nasnet-panel

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
          - platform: linux/arm/v7
            suffix: armv7
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:dev-${{ matrix.suffix }}
          build-args: |
            APP_VERSION=dev-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      - name: Enforce 15MB image size
        run: |
          set -euo pipefail
          FIRST_TAG="${{ env.IMAGE }}:dev-${{ matrix.suffix }}"
          SIZE_BYTES=$(docker buildx imagetools inspect "$FIRST_TAG" --raw \
            | jq '[.layers[].size] | add')
          SIZE_MB=$(awk "BEGIN { printf \"%.2f\", $SIZE_BYTES / 1048576 }")
          echo "Image $FIRST_TAG compressed size: ${SIZE_MB} MB"
          echo "- ${{ matrix.suffix }}: **${SIZE_MB} MB**" >> "$GITHUB_STEP_SUMMARY"
          if awk -v s="$SIZE_MB" 'BEGIN { exit !(s+0 > 15) }'; then
            echo "::error::Image exceeds 15MB budget (${SIZE_MB} MB)"
            exit 1
          fi
          if awk -v s="$SIZE_MB" 'BEGIN { exit !(s+0 > 12) }'; then
            echo "::warning::Image over 12MB soft warning (${SIZE_MB} MB)"
          fi

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          set -euo pipefail
          SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          for TAG in dev "dev-${SHA}" latest; do
            echo "-> ${IMAGE}:${TAG}"
            docker buildx imagetools create --tag "${IMAGE}:${TAG}" \
              "${IMAGE}:dev-amd64" \
              "${IMAGE}:dev-arm64" \
              "${IMAGE}:dev-armv7"
          done

  package:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Log in to ${{ env.REGISTRY }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin

      - name: Package per-arch RouterOS container tars
        run: |
          set -euo pipefail
          mkdir -p dist
          for SUFFIX in amd64 arm64 armv7; do
            REF="${IMAGE}:dev-${SUFFIX}"
            OUT="nasnet-panel-dev-${SUFFIX}.tar"
            echo "-> ${REF} => dist/${OUT}"
            skopeo copy "docker://${REF}" "docker-archive:dist/${OUT}:nasnet-panel:dev-${SUFFIX}"
            ( cd dist && sha256sum "${OUT}" > "${OUT}.sha256" )
          done

      - name: Publish to rolling snapshot release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot
          name: Dev snapshot
          prerelease: true
          body: |
            Rolling development snapshot, rebuilt on every push to `dev`.
            Commit ${{ github.sha }}.

            RouterOS container image tars consumed by `scripts/install.sh`:
            - `nasnet-panel-dev-amd64.tar` (RouterOS x86_64)
            - `nasnet-panel-dev-arm64.tar` (RouterOS arm64)
            - `nasnet-panel-dev-armv7.tar` (RouterOS arm)

            Graphical installers:
            - `nasnet-panel-installer-windows-amd64.exe` (Windows)
            - `nasnet-panel-installer-macos-universal.dmg` (macOS)
          files: |
            dist/*.tar
            dist/*.tar.sha256

  installer-windows:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-go-backend
        with:
          go-version-file: graphical-installer/go.mod
          cache-dependency-path: graphical-installer/go.sum

      - name: Build Windows installer
        working-directory: graphical-installer
        run: |
          set -euo pipefail
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -tags desktop,production \
            -ldflags "-s -w -H windowsgui" \
            -o dist/nasnet-panel-installer-windows-amd64.exe .
          ( cd dist && sha256sum nasnet-panel-installer-windows-amd64.exe > nasnet-panel-installer-windows-amd64.exe.sha256 )

      - name: Publish installer to snapshot release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot
          prerelease: true
          files: |
            graphical-installer/dist/*.exe
            graphical-installer/dist/*.exe.sha256

  installer-macos:
    needs: package
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-go-backend
        with:
          go-version-file: graphical-installer/go.mod
          cache-dependency-path: graphical-installer/go.sum

      - name: Build macOS installer app
        working-directory: graphical-installer
        run: |
          set -euo pipefail
          mkdir -p dist
          # Wails v2.13 references UTType without linking its framework
          export CGO_LDFLAGS="-framework UniformTypeIdentifiers"
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 \
            go build -trimpath -tags desktop,production \
            -ldflags "-s -w" -o dist/installer-arm64 .
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=1 \
            go build -trimpath -tags desktop,production \
            -ldflags "-s -w" -o dist/installer-amd64 .
          lipo -create -output dist/nasnet-panel-installer dist/installer-arm64 dist/installer-amd64
          APP="dist/Nasnet Panel Installer.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp darwin/Info.plist "$APP/Contents/Info.plist"
          cp dist/nasnet-panel-installer "$APP/Contents/MacOS/nasnet-panel-installer"
          ICONSET=dist/appicon.iconset
          mkdir -p "$ICONSET"
          for SIZE in 16 32 128; do
            sips -z "$SIZE" "$SIZE" frontend/dist/logo.png --out "$ICONSET/icon_${SIZE}x${SIZE}.png"
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/appicon.icns"

      - name: Create DMG
        working-directory: graphical-installer
        run: |
          set -euo pipefail
          STAGE=dist/dmg
          mkdir -p "$STAGE"
          cp -R "dist/Nasnet Panel Installer.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Nasnet Panel Installer" -srcfolder "$STAGE" -ov -format UDZO \
            dist/nasnet-panel-installer-macos-universal.dmg
          ( cd dist && shasum -a 256 nasnet-panel-installer-macos-universal.dmg > nasnet-panel-installer-macos-universal.dmg.sha256 )

      - name: Publish installer to snapshot release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot
          prerelease: true
          files: |
            graphical-installer/dist/*.dmg
            graphical-installer/dist/*.dmg.sha256
