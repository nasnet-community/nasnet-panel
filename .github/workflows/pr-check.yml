name: PR Check

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  up-to-date:
    name: Up-to-date with ${{ github.base_ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Compare PR head to ${{ github.base_ref }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEHIND=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.pull_request.base.ref }}...${{ github.event.pull_request.head.sha }}" --jq '.behind_by')
          if [ "$BEHIND" -gt 0 ]; then
            echo "::error::Branch is $BEHIND commit(s) behind ${{ github.base_ref }}. Rebase or merge."
            exit 1
          fi
          echo "Branch is up-to-date."

  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      frontend: ${{ steps.areas.outputs.frontend }}
      backend: ${{ steps.areas.outputs.backend }}
      installer: ${{ steps.areas.outputs.installer }}
    steps:
      - name: Classify changed files
        id: areas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          FRONTEND=false
          BACKEND=false
          INSTALLER=false
          while IFS= read -r FILE; do
            [ -n "$FILE" ] || continue
            case "$FILE" in
              .github/*) FRONTEND=true; BACKEND=true; INSTALLER=true ;;
              backend/*) BACKEND=true ;;
              graphical-installer/*|scripts/*) FRONTEND=true; INSTALLER=true ;;
              *) FRONTEND=true ;;
            esac
          done <<< "$FILES"
          if [ -z "$FILES" ]; then
            FRONTEND=true
            BACKEND=true
            INSTALLER=true
          fi
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "installer=$INSTALLER" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND backend=$BACKEND installer=$INSTALLER"

  frontend:
    name: Frontend (format · typecheck · build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: up-to-date
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node-workspace
        with:
          node-version: '20'

      - name: Prettier (format:check)
        run: npm run format:check

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Webpack production build
        run: npm run build

  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: up-to-date
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node-workspace
        with:
          node-version: '20'

      - name: ESLint
        run: npm run lint

  backend:
    name: Backend (fmt · vet · lint · build · test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: up-to-date
    steps:
      - uses: actions/checkout@v5

      - name: Fetch ${{ github.base_ref }} for lint diff
        run: git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }} --depth=50

      - uses: ./.github/actions/setup-go-backend

      - name: Install golangci-lint v2
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Format check (gofmt + goimports)
        working-directory: backend
        run: golangci-lint fmt --diff

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: golangci-lint
        working-directory: backend
        run: golangci-lint run --timeout=5m

      - name: go build
        working-directory: backend
        run: go build ./...

      - name: go test
        working-directory: backend
        run: go test -vet=off ./...

  nilaway:
    name: Nilaway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: up-to-date
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-go-backend

      - name: Install nilaway
        run: go install go.uber.org/nilaway/cmd/nilaway@latest

      - name: nilaway
        working-directory: backend
        run: nilaway ./...

  installer:
    name: Installer (fmt · vet · build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: up-to-date
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-go-backend
        with:
          go-version-file: graphical-installer/go.mod
          cache-dependency-path: graphical-installer/go.sum

      - name: Stage LAN baseline script
        run: cp scripts/nasnet-lan-baseline.rsc graphical-installer/assets/

      - name: Format check (gofmt)
        working-directory: graphical-installer
        run: test -z "$(gofmt -l .)"

      - name: go vet
        working-directory: graphical-installer
        run: GOOS=windows GOARCH=amd64 go vet -tags desktop,production ./...

      - name: go build (windows/amd64)
        working-directory: graphical-installer
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags desktop,production -ldflags "-H windowsgui" -o /dev/null .

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: up-to-date
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node-workspace
        with:
          node-version: '20'

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  status:
    name: PR Status
    runs-on: ubuntu-latest
    needs: [up-to-date, changes, frontend, eslint, backend, nilaway, installer, e2e]
    if: always()
    steps:
      - name: Check job results
        env:
          RESULTS: |
            Up-to-date=${{ needs.up-to-date.result }}
            Changes=${{ needs.changes.result }}
            Frontend=${{ needs.frontend.result }}
            ESLint=${{ needs.eslint.result }}
            Backend=${{ needs.backend.result }}
            Nilaway=${{ needs.nilaway.result }}
            Installer=${{ needs.installer.result }}
            E2E=${{ needs.e2e.result }}
        run: |
          FAILED=0
          while IFS='=' read -r NAME RESULT; do
            [ -n "$NAME" ] || continue
            echo "$NAME: $RESULT"
            case "$RESULT" in
              success | skipped) ;;
              *) FAILED=1 ;;
            esac
          done <<< "$RESULTS"
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more checks failed"
            exit 1
          fi
          echo "All PR checks passed"
