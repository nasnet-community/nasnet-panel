name: Dev release

# Every merge to dev gets its own pre-release: the version is not bumped, the newest stable or
# release candidate version gets a dev suffix and is built as
# vX.Y.Z-dev.<date>.<n> through release.yml. Stable (vX.Y.Z) and release candidate
# (vX.Y.Z-rc.N) builds are made by pushing that tag by hand.

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: dev-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: next
        run: |
          set -euo pipefail
          BASE="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' || true; } | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/' | sort -V | tail -n 1)"
          BASE="${BASE:-0.0.0}"

          PREFIX="v${BASE}-dev.$(date -u +%Y%m%d)."
          HIGHEST="$(git tag --list "${PREFIX}*" | sed "s/^${PREFIX}//" | sort -n | tail -n 1)"
          TAG="${PREFIX}$(( ${HIGHEST:-0} + 1 ))"
          echo "Latest stable or rc version ${BASE} -> ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Tag the merged commit
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Development release $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

  release:
    needs: version
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.version.outputs.tag }}
    secrets: inherit
