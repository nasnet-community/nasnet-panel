name: Release Docker image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag already created on the commit being built (e.g. v1.3.0-dev.20261026.1)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. dev-snapshot, v1.2.3-test)'
        required: true
        default: 'manual'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/nasnet-community/nasnet-panel

jobs:
  # Stable (v1.2.3), release candidate (v1.3.0-rc.1) and development
  # (v1.3.0-dev.20261026.1) builds all flow through this workflow. A tag push
  # triggers it directly; dev-release.yml calls it with release_tag, in which
  # case github.ref_name is the branch, so the tag is resolved once here.
  meta:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      release: ${{ steps.resolve.outputs.release }}
      relmeta: ${{ steps.relmeta.outputs.json }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: release-meta.json
          sparse-checkout-cone-mode: false

      - id: relmeta
        name: Read and validate release metadata
        run: |
          meta="$(jq -c . release-meta.json)"
          jq -e '.app.minVersion | strings | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")' release-meta.json >/dev/null || { echo "release-meta.json needs app.minVersion like 1.2.0" >&2; exit 1; }
          case "$meta" in *--*) echo "release-meta.json must not contain '--'" >&2; exit 1 ;; esac
          echo "json=${meta}" >> "$GITHUB_OUTPUT"

      # release is true for a pushed tag and for a call from dev-release.yml, and false for
      # workflow_dispatch test builds, which publish images under an arbitrary tag only.
      - id: resolve
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          RELEASE=true
          if [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
            RELEASE=false
          else
            TAG="$GITHUB_REF_NAME"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Building ${TAG} (release: ${RELEASE})"

  build:
    needs: meta
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
          - platform: linux/arm/v7
            suffix: armv7
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # Per-arch images must never claim `latest` — three matrix jobs would
          # race and leave it pointing at whichever arch pushed last.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},suffix=-${{ matrix.suffix }},value=${{ needs.meta.outputs.release == 'true' && needs.meta.outputs.tag || '' }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.suffix }},value=${{ needs.meta.outputs.release == 'true' && needs.meta.outputs.tag || '' }}
            type=raw,value=${{ inputs.tag }}-${{ matrix.suffix }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ needs.meta.outputs.tag }}
          secrets: |
            router_key_secret=${{ secrets.ROUTER_KEY_SECRET }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      - name: Enforce 15MB image size budget
        run: |
          set -euo pipefail
          FIRST_TAG=$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -n1)
          SIZE_BYTES=$(docker buildx imagetools inspect "$FIRST_TAG" --raw \
            | jq '[.layers[].size] | add')
          SIZE_MB=$(awk "BEGIN { printf \"%.2f\", $SIZE_BYTES / 1048576 }")
          echo "Image $FIRST_TAG compressed size: ${SIZE_MB} MB"
          echo "- ${{ matrix.suffix }}: **${SIZE_MB} MB**" >> "$GITHUB_STEP_SUMMARY"
          if awk -v s="$SIZE_MB" 'BEGIN { exit !(s+0 > 15) }'; then
            echo "::error::Image exceeds 15MB budget (${SIZE_MB} MB)"
            exit 1
          fi
          if awk -v s="$SIZE_MB" 'BEGIN { exit !(s+0 > 12) }'; then
            echo "::warning::Image over 12MB soft warning (${SIZE_MB} MB)"
          fi

  manifest:
    needs: [meta, build]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      # A tag cut from an older commit (backport, or a re-tag of history) must
      # not hijack `latest`. Only the default-branch tip is allowed to move it.
      - id: gate
        name: Check tag is at default-branch tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "${{ needs.meta.outputs.release }}" != "true" ]; then
            echo "is_tip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TIP=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${DEFAULT_BRANCH}" \
            | jq -r .sha)
          if [ "$TIP" = "$GITHUB_SHA" ]; then
            echo "is_tip=true" >> "$GITHUB_OUTPUT"
            echo "${TAG} is at ${DEFAULT_BRANCH} tip; :latest will move"
          else
            echo "is_tip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} (${GITHUB_SHA}) is not at ${DEFAULT_BRANCH} tip (${TIP}); leaving :latest unchanged"
          fi

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # `latest` is declared explicitly below rather than left to latest=auto,
          # so the prerelease and dispatch conditions are visible here.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.meta.outputs.release == 'true' && needs.meta.outputs.tag || '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.meta.outputs.release == 'true' && needs.meta.outputs.tag || '' }}
            type=raw,value=latest,enable=${{ needs.meta.outputs.release == 'true' && !contains(needs.meta.outputs.tag, '-') && steps.gate.outputs.is_tip == 'true' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create multi-arch manifests
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BASE="${TAG}"
          else
            BASE="${TAG#v}"
          fi
          echo "Combining per-arch images for base: $BASE"
          while IFS= read -r IMAGE_TAG; do
            [ -z "$IMAGE_TAG" ] && continue
            echo "  -> $IMAGE_TAG"
            docker buildx imagetools create --tag "$IMAGE_TAG" \
              "${{ env.IMAGE }}:${BASE}-amd64" \
              "${{ env.IMAGE }}:${BASE}-arm64" \
              "${{ env.IMAGE }}:${BASE}-armv7"
          done <<< "${{ steps.meta.outputs.tags }}"

  # Only real releases (a pushed tag or a call from dev-release.yml) get a GitHub Release;
  # workflow_dispatch builds test images under an arbitrary tag and must not publish one.
  package:
    needs: [meta, build, manifest]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.meta.outputs.tag }}
    permissions:
      contents: write
      packages: read
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Log in to ${{ env.REGISTRY }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin

      # Asset names carry the version without the leading "v" to match the
      # channel that scripts/install.sh derives from --version.
      - id: pkg
        name: Package per-arch RouterOS container tars
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          for SUFFIX in amd64 arm64 armv7; do
            REF="${IMAGE}:${VERSION}-${SUFFIX}"
            OUT="nasnet-panel-${VERSION}-${SUFFIX}.tar"
            echo "-> ${REF} => dist/${OUT}"
            skopeo copy "docker://${REF}" "docker-archive:dist/${OUT}:nasnet-panel:${VERSION}-${SUFFIX}"
            ( cd dist && sha256sum "${OUT}" > "${OUT}.sha256" )
          done

      - name: Publish release with container tars
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: NasNet Panel ${{ needs.meta.outputs.tag }}
          prerelease: ${{ contains(needs.meta.outputs.tag, '-') }}
          generate_release_notes: true
          body: |
            Install on RouterOS:

            ```
            ./install.sh --version ${{ needs.meta.outputs.tag }}
            ```

            RouterOS container image tars consumed by `scripts/install.sh`:
            - `nasnet-panel-${{ steps.pkg.outputs.version }}-amd64.tar` (RouterOS x86_64)
            - `nasnet-panel-${{ steps.pkg.outputs.version }}-arm64.tar` (RouterOS arm64)
            - `nasnet-panel-${{ steps.pkg.outputs.version }}-armv7.tar` (RouterOS arm)

            Graphical installers:
            - `nasnet-panel-installer-windows-${{ steps.pkg.outputs.version }}.exe` (Windows)
            - `nasnet-panel-installer-macos-${{ steps.pkg.outputs.version }}.dmg` (macOS)

            Container image: `${{ env.IMAGE }}:${{ steps.pkg.outputs.version }}`

            <!-- nasnet-meta: ${{ needs.meta.outputs.relmeta }} -->
          files: |
            dist/*.tar
            dist/*.tar.sha256

  installer-windows:
    needs: [meta, package]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-go-backend
        with:
          go-version-file: graphical-installer/go.mod
          cache-dependency-path: graphical-installer/go.sum

      - name: Resolve asset version
        run: echo "ASSET_VERSION=${APP_VERSION#v}" >> "$GITHUB_ENV"

      - name: Stage LAN baseline script
        run: cp scripts/nasnet-lan-baseline.rsc graphical-installer/assets/

      - name: Stamp Windows version resource
        run: scripts/installer-windows-resource.sh "$APP_VERSION" "${{ github.run_number }}"

      - name: Build Windows installer
        working-directory: graphical-installer
        run: |
          set -euo pipefail
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -tags desktop,production \
            -ldflags "-s -w -H windowsgui -X nasnet-panel-installer/internal/buildinfo.Version=$APP_VERSION" \
            -o "dist/nasnet-panel-installer-windows-${ASSET_VERSION}.exe" .
          ( cd dist && sha256sum "nasnet-panel-installer-windows-${ASSET_VERSION}.exe" > "nasnet-panel-installer-windows-${ASSET_VERSION}.exe.sha256" )

      - name: Publish installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          prerelease: ${{ contains(needs.meta.outputs.tag, '-') }}
          files: |
            graphical-installer/dist/*.exe
            graphical-installer/dist/*.exe.sha256

  installer-macos:
    needs: [meta, package]
    if: needs.meta.outputs.release == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.meta.outputs.tag }}
      BUNDLE_BUILD: ${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-go-backend
        with:
          go-version-file: graphical-installer/go.mod
          cache-dependency-path: graphical-installer/go.sum

      - name: Resolve asset version
        run: echo "ASSET_VERSION=${APP_VERSION#v}" >> "$GITHUB_ENV"

      - name: Stage LAN baseline script
        run: cp scripts/nasnet-lan-baseline.rsc graphical-installer/assets/

      - name: Build macOS installer app
        working-directory: graphical-installer
        run: |
          set -euo pipefail
          mkdir -p dist
          # Wails v2.13 references UTType without linking its framework
          export CGO_LDFLAGS="-framework UniformTypeIdentifiers"
          LDFLAGS="-s -w -X nasnet-panel-installer/internal/buildinfo.Version=$APP_VERSION"
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 \
            go build -trimpath -tags desktop,production \
            -ldflags "$LDFLAGS" -o dist/installer-arm64 .
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=1 \
            go build -trimpath -tags desktop,production \
            -ldflags "$LDFLAGS" -o dist/installer-amd64 .
          lipo -create -output dist/nasnet-panel-installer dist/installer-arm64 dist/installer-amd64
          APP="dist/Nasnet Panel Installer.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp darwin/Info.plist "$APP/Contents/Info.plist"
          BUNDLE_VERSION="${APP_VERSION#v}"
          BUNDLE_VERSION="${BUNDLE_VERSION%%-*}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${BUNDLE_VERSION}" \
            -c "Set :CFBundleVersion ${BUNDLE_BUILD}" "$APP/Contents/Info.plist"
          cp dist/nasnet-panel-installer "$APP/Contents/MacOS/nasnet-panel-installer"
          ICONSET=dist/appicon.iconset
          mkdir -p "$ICONSET"
          for SIZE in 16 32 128; do
            sips -z "$SIZE" "$SIZE" frontend/dist/logo.png --out "$ICONSET/icon_${SIZE}x${SIZE}.png"
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/appicon.icns"

      - name: Create DMG
        working-directory: graphical-installer
        run: |
          set -euo pipefail
          STAGE=dist/dmg
          mkdir -p "$STAGE"
          cp -R "dist/Nasnet Panel Installer.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Nasnet Panel Installer" -srcfolder "$STAGE" -ov -format UDZO \
            "dist/nasnet-panel-installer-macos-${ASSET_VERSION}.dmg"
          ( cd dist && shasum -a 256 "nasnet-panel-installer-macos-${ASSET_VERSION}.dmg" > "nasnet-panel-installer-macos-${ASSET_VERSION}.dmg.sha256" )

      - name: Publish installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          prerelease: ${{ contains(needs.meta.outputs.tag, '-') }}
          files: |
            graphical-installer/dist/*.dmg
            graphical-installer/dist/*.dmg.sha256
