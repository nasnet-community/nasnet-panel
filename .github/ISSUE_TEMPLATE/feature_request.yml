name: Feature request
description: Suggest a new feature or improvement.
title: '[Feature]: '
labels: ['enhancement', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the use case before the solution. It helps maintainers evaluate alternatives.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and did not find a duplicate or active discussion.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, the user, and the pain point. Avoid jumping straight to a proposed solution.
      placeholder: I manage 40 sites and I cannot tell at a glance which ones have firmware updates pending.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work?
      placeholder: A column on the router list showing `current` vs `available` firmware version, sortable by "needs update".
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you have tried or other designs you have considered.

  - type: dropdown
    id: scope
    attributes:
      label: Which area does this affect?
      multiple: true
      options:
        - Dashboard
        - Network
        - VPN
        - Wireless
        - Firewall
        - Router discovery
        - Batch operations
        - API / backend
        - MikroTik installer (scripts/install.sh)
        - Docker / packaging
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links to related issues, RouterOS docs, screenshots, mockups, anything that helps.
