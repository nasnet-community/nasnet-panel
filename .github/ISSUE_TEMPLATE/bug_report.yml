name: Bug report
description: Report something that is broken or behaves incorrectly.
title: '[Bug]: '
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in as much of the form as you can. It speeds up triage significantly.

        **Security issues:** do not file them here. Use a [private security advisory](https://github.com/nasnet-community/nasnet-panel/security/advisories/new).

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      description: Please confirm before submitting.
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I am running the latest release (or a recent `main`/`dev` build) and can still reproduce.
          required: true
        - label: This is not a security vulnerability.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the bug.
      placeholder: WireGuard peer list fails to render when a peer has no last-handshake timestamp.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, numbered steps that reliably reproduce the bug.
      placeholder: |
        1. Connect to a router with a freshly created WireGuard interface.
        2. Open the Wireless section.
        3. Click "Peers".
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: The peer list renders with empty handshake column.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happens. Include error messages, stack traces, or screenshots.
      placeholder: "The page shows a blank screen and the console logs `TypeError: Cannot read properties of undefined (reading 'toISOString')`."
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: How are you running Nasnet Panel?
      options:
        - Docker (ghcr.io image)
        - Docker (locally built)
        - MikroTik RouterOS container (via scripts/install.sh)
        - MikroTik RouterOS container (manual)
        - From source (npm run dev:all)
        - Other (describe below)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Nasnet Panel version
      description: Release tag, container digest, or commit SHA.
      placeholder: v0.1.3 or sha-abc1234
    validations:
      required: true

  - type: input
    id: routeros_version
    attributes:
      label: RouterOS version (if applicable)
      description: Output of `/system resource print` -> `version` on the affected router.
      placeholder: 7.14.3 (stable)

  - type: input
    id: host_platform
    attributes:
      label: Host platform
      description: OS and architecture where Nasnet Panel runs (skip if running on the router itself).
      placeholder: Ubuntu 22.04 / x86_64

  - type: dropdown
    id: browser
    attributes:
      label: Browser (for frontend bugs)
      options:
        - Not applicable
        - Chrome / Chromium
        - Firefox
        - Safari
        - Edge
        - Other

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Container logs (`docker logs nasnet`), RouterOS container logs (`/log/print where topics~"container"`), or browser console output. Redact credentials.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might be relevant (network topology, custom firewall rules, recent config changes).
