host: localhost:8080
info:
  contact:
    name: API Support
  description: RouterOS Network Management Panel - REST API for managing RouterOS
    devices
  title: NASNET-Panel API
  version: "1.0"
paths:
  /api/dhcp/client/{nameOrID}:
    post:
      consumes:
      - application/json
      description: Create or update a DHCP client on the specified interface with
        use-peer-dns=yes, use-peer-ntp=yes, add-default-route=no, and enabled.
      parameters:
      - description: RouterOS host address
        in: header
        name: X-RouterOS-Host
        required: true
        type: string
      - description: Interface name or ID
        in: path
        name: nameOrID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/handler.ConfigureDHCPClientResponse'
              type: object
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Interface not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BasicAuth: []
      summary: Configure a DHCP client on an interface
      tags:
      - DHCP
  /api/dhcp/clients:
    get:
      consumes:
      - application/json
      description: Get all DHCP clients configured on RouterOS
      parameters:
      - description: RouterOS host address
        in: header
        name: X-RouterOS-Host
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: DHCP clients list
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BasicAuth: []
      summary: List DHCP clients
      tags:
      - DHCP
  /api/dhcp/leases:
    get:
      consumes:
      - application/json
      description: Get all active DHCP leases from RouterOS
      parameters:
      - description: RouterOS host address
        in: header
        name: X-RouterOS-Host
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: DHCP leases list
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BasicAuth: []
      summary: List DHCP leases
      tags:
      - DHCP
  /api/dhcp/leases/{macAddress}:
    delete:
      consumes:
      - application/json
      description: Remove a DHCP lease by MAC address
      parameters:
      - description: RouterOS host address
        in: header
        name: X-RouterOS-Host
        required: true
        type: string
      - description: MAC address of the lease to remove
        in: path
        name: macAddress
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Lease removed successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Lease not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BasicAuth: []
