id: '1.1-preconditions'
stage: install
title: Router matches the install preconditions
profiles: [all]
start: container-ready
expect:
  values:
    - path: /system/resource
      fields: { version: '~7.24.2' }
    - path: /system/package
      where: { name: container }
      count: 1
    - path: /system/device-mode
      fields: { container: 'yes' }
    - path: /container
      count: 0
    - path: /interface/veth
      count: 0
