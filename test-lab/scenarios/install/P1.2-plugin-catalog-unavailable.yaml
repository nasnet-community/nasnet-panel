id: 'P1.2-plugin-catalog-unavailable'
stage: install
title: Unreachable plugin registry gives a clear error and changes nothing
profiles: [all]
start: installed
panel: host
wizard:
  foreign: starlink
  domestic: domestic
  wait_domestic_list: true
steps:
  - do: filter
    with: { target: registry }
  - do: api
    api: { method: GET, path: /api/plugin/plugins, status: 502, contains: [registry] }
expect:
  values:
    - path: /container
      count: 1
