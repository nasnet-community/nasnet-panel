id: 'D2.3-foreign-type'
stage: wizard
title: Foreign-forwarded names resolve over Starlink
profiles: [all]
requires: { roles: [starlink, domestic, split] }
wizard:
  foreign: starlink
  domestic: domestic
  wait_domestic_list: true
