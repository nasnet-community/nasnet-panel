id: '2.1-dual-link-l2tp'
stage: wizard
title: Dual-link with an L2TP client applies the expected config
profiles: [all]
requires: { roles: [starlink, domestic, split], lab: [l2tp] }
wizard:
  foreign: starlink
  domestic: domestic
  l2tp_client: true
  wait_domestic_list: true
expect:
  applied:
    {
      sections:
        [
          bridges,
          interface-lists,
          macvlans,
          addresses,
          dhcp-servers,
          dhcp-networks,
          pools,
          dns,
          dns-static,
          routing-tables,
          routing-rules,
          routes,
          blackholes,
          firewall-filter,
          nat,
          mangle,
          address-lists,
          netwatch,
          scripts,
          schedulers,
          ppp-profiles,
          marker,
        ],
    }
  sections:
    - path: /interface/l2tp-client
      key: name
      present: [l2tp-client-L2TP-Client]
    - path: /routing/table
      key: name
      present: [to-VPN-L2TP-Client]
