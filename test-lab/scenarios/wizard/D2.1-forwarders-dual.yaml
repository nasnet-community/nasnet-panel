id: 'D2.1-forwarders-dual'
stage: wizard
title: Dual-link has all four DNS forwarder types
profiles: [all]
requires: { roles: [starlink, domestic, split] }
wizard:
  foreign: starlink
  domestic: domestic
  wait_domestic_list: true
expect:
  sections:
    - path: /ip/dns/forwarders
      key: name
      present: [Domestic, Foreign, VPN, General]
