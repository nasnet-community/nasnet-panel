id: '2.1-starlink-only'
stage: wizard
title: Starlink-only wizard applies the expected config
profiles: [all]
requires: { roles: [starlink, split] }
wizard:
  foreign: starlink
  wait_domestic_list: true
expect:
  applied:
    {
      sections:
        [
          bridges,
          interface-lists,
          macvlans,
          addresses,
          dhcp-servers,
          dhcp-networks,
          pools,
          dns,
          dns-static,
          routing-tables,
          routing-rules,
          routes,
          blackholes,
          firewall-filter,
          nat,
          mangle,
          address-lists,
          netwatch,
          scripts,
          schedulers,
          ppp-profiles,
          marker,
        ],
    }
  sections:
    - path: /routing/table
      key: name
      present: [to-Split, to-Foreign, to-Foreign-Foreign Link, to-VPN]
      absent: [to-Domestic, to-Domestic-Domestic Link]
  files:
    absent: [wizard.rsc]
    no_secrets: true
    known_bug: wizard.rsc with the router password stays on the router
