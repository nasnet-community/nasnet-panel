id: '2.1-dual-link'
stage: wizard
title: Dual-link wizard applies the expected config
profiles: [all]
requires: { roles: [starlink, domestic, split] }
wizard:
  foreign: starlink
  domestic: domestic
  wait_domestic_list: true
expect:
  applied:
    {
      sections:
        [
          bridges,
          interface-lists,
          macvlans,
          addresses,
          dhcp-servers,
          dhcp-networks,
          pools,
          dns,
          dns-static,
          routing-tables,
          routing-rules,
          routes,
          blackholes,
          firewall-filter,
          nat,
          mangle,
          address-lists,
          netwatch,
          scripts,
          schedulers,
          ppp-profiles,
          marker,
        ],
    }
  sections:
    - path: /routing/table
      key: name
      present:
        [
          to-Split,
          to-Domestic,
          to-Domestic-Domestic Link,
          to-Foreign,
          to-Foreign-Foreign Link,
          to-VPN,
        ]
  files:
    absent: [wizard.rsc]
    no_secrets: true
    known_bug: wizard.rsc with the router password stays on the router
