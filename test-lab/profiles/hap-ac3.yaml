    kind: poe-in
    role: starlink
  - name: ether2
    kind: ethernet
    role: domestic
  - name: ether3
    kind: ethernet
    role: split
  - name: ether4
    kind: ethernet
    role: spare
  - name: ether5
    kind: ethernet
    role: spare
