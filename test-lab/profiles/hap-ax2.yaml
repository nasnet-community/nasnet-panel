name: hap-ax2
model: hAP ax2 C52iG-5HaxD2HaxD
arch: arm64
memory_mb: 1024
storage_mb: 128
cpus: 1
capabilities: [ethernet, container, wifi, poe-out]
ports:
  - name: ether1
    kind: poe-in
    role: starlink
  - name: ether2
    kind: ethernet
    role: domestic
  - name: ether3
    kind: ethernet
    role: split
  - name: ether4
    kind: ethernet
    role: spare
  - name: ether5
    kind: poe-out
    role: spare
