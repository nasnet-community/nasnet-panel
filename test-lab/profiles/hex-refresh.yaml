name: hex-refresh
model: hEX refresh E50UG
arch: arm64
memory_mb: 512
storage_mb: 128
cpus: 1
capabilities: [ethernet, container, usb]
ports:
  - name: ether1
    kind: ethernet
    role: starlink
  - name: ether2
    kind: ethernet
    role: domestic
  - name: ether3
    kind: ethernet
    role: split
  - name: ether4
    kind: ethernet
    role: spare
  - name: ether5
    kind: ethernet
    role: spare
