name: crs504
model: CRS504-4XQ-IN
arch: arm64
memory_mb: 1024
storage_mb: 128
cpus: 1
capabilities: [ethernet, container, qsfp]
ports:
  - name: ether1
    kind: ethernet
    role: split
  - name: qsfp28-1-1
    kind: qsfp28
    role: starlink
  - name: qsfp28-2-1
    kind: qsfp28
    role: domestic
  - name: qsfp28-3-1
    kind: qsfp28
    role: spare
